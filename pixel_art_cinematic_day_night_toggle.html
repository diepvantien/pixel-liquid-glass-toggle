<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel-Art Cinematic Day/Night Toggle — Liquid Glass</title>
  <meta name="description" content="Interactive Pixel-Art Cinematic Day/Night Theme Toggle with physically inspired WebGL Liquid Glass refraction, 8-channel lighting engine, real-time audio synthesis, and 9:16 video studio." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Prevent flash of incorrect theme before first paint -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('cinematic-toggle-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var initial = (saved === 'light' || saved === 'dark') ? saved : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', initial);
        if (initial === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        // Fallback to light mode if storage is restricted
      }
    })();
  </script>

  <style>
    /* =========================================================================
       DESIGN TOKENS & THEME SYSTEM
       ========================================================================= */
    :root {
      --color-background: #EFF0F5;
      --color-surface: rgba(255, 255, 255, 0.78);
      --color-surface-solid: #FFFFFF;
      --color-text: #1B2436;
      --color-muted: #65728A;
      --color-border: rgba(27, 36, 54, 0.10);
      --color-shadow: rgba(25, 38, 66, 0.14);
      --color-accent: #3B6CE2;

      /* Dynamic metallic capsule tokens (updated smoothly by LightingEngine) */
      --frame-reflect: 0.85;
      --night-mix: 0.0;
      --toggle-width: 440px;
      --toggle-height: 238px;
    }

    html[data-theme="dark"] {
      --color-background: #0C1029;
      --color-surface: rgba(20, 29, 58, 0.78);
      --color-surface-solid: #141D3A;
      --color-text: #E9EEF9;
      --color-muted: #8C9BBF;
      --color-border: rgba(155, 180, 235, 0.14);
      --color-shadow: rgba(2, 5, 18, 0.65);
      --color-accent: #7EA8FF;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--color-background);
      color: var(--color-text);
      transition: background-color 420ms cubic-bezier(0.22, 1, 0.36, 1),
                  color 360ms cubic-bezier(0.22, 1, 0.36, 1);
      overflow-x: hidden;
    }

    /* Subtle atmospheric ambient backdrop behind the toggle */
    .stage-ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      transition: opacity 500ms ease;
    }

    .stage-ambient::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 60% 50% at 50% 46%,
        rgba(255, 255, 255, 0.65) 0%,
        rgba(239, 240, 245, 0) 70%
      );
      opacity: calc(1 - var(--night-mix));
    }

    .stage-ambient::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 52% 44% at 50% 48%,
        rgba(56, 86, 178, 0.22) 0%,
        rgba(26, 38, 86, 0.08) 45%,
        rgba(12, 16, 41, 0) 75%
      );
      opacity: var(--night-mix);
    }

    /* =========================================================================
       METALLIC CAPSULE HOUSING (3D EXTRUDED PHYSICAL BEZEL)
       ========================================================================= */
    .toggle-scale-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px;
      position: relative;
      z-index: 2;
    }

    .cinematic-toggle {
      position: relative;
      width: var(--toggle-width);
      height: var(--toggle-height);
      max-width: calc(100vw - 32px);
      aspect-ratio: 440 / 238;
      height: auto;
      border-radius: 9999px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      user-select: none;
      touch-action: none;
      outline: none;
      display: block;
      transform: translateZ(0);
    }

    .cinematic-toggle[aria-disabled="true"] {
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* Accessible focus ring */
    .cinematic-toggle:focus-visible .capsule-outer-bezel {
      box-shadow:
        0 0 0 4px var(--color-background),
        0 0 0 7px var(--color-accent),
        var(--capsule-shadow);
    }

    /* Outer broad diffused shadow + subtle night blue-violet ambient glow */
    .capsule-outer-bezel {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 9999px;
      padding: 1.9%;
      --capsule-shadow:
        0 24px 44px -12px rgba(24, 34, 58, 0.26),
        0 8px 18px -6px rgba(24, 34, 58, 0.15),
        0 2px 5px rgba(24, 34, 58, 0.09);
      background: linear-gradient(
        180deg,
        #FFFFFF 0%,
        #E9EDF4 16%,
        #CFD6E2 50%,
        #B5BFCF 78%,
        #DFE4EE 95%,
        #F7F9FC 100%
      );
      box-shadow:
        var(--capsule-shadow),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.96),
        inset 0 -2px 3px rgba(86, 98, 122, 0.34);
      transition: transform 180ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .cinematic-toggle:active:not([aria-disabled="true"]) .capsule-outer-bezel {
      transform: scale(0.994);
    }

    /* Dark-mode metallic overlay layer driven smoothly by --night-mix */
    .capsule-metal-night-overlay {
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      pointer-events: none;
      opacity: var(--night-mix);
      background: linear-gradient(
        180deg,
        #475678 0%,
        #2A3654 18%,
        #1B243D 52%,
        #12192D 80%,
        #263250 96%,
        #3A496D 100%
      );
      box-shadow:
        0 30px 60px -10px rgba(2, 5, 18, 0.82),
        0 12px 26px -4px rgba(5, 10, 30, 0.68),
        0 0 42px rgba(66, 102, 214, 0.22),
        inset 0 2px 3px rgba(164, 188, 240, 0.34),
        inset 0 -3px 5px rgba(4, 8, 22, 0.85);
    }

    /* Crisp upper-edge specular metallic highlight */
    .capsule-rim-highlight {
      position: absolute;
      inset: 0.5px;
      border-radius: 9999px;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, calc(0.88 - var(--night-mix) * 0.56));
      mask-image: linear-gradient(180deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0.18) 42%, rgba(0,0,0,0.05) 75%, rgba(0,0,0,0.55) 100%);
      -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0.18) 42%, rgba(0,0,0,0.05) 75%, rgba(0,0,0,0.55) 100%);
    }

    /* Inner recessed bevel step */
    .capsule-inner-bevel {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 9999px;
      padding: 0.75%;
      background: linear-gradient(
        180deg,
        #9EA9BC 0%,
        #C5CDDB 45%,
        #EEF1F7 100%
      );
      box-shadow:
        inset 0 2.5px 6px rgba(24, 34, 56, 0.36),
        inset 0 -1.5px 3px rgba(255, 255, 255, 0.75);
      z-index: 2;
    }

    .capsule-inner-bevel-night {
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      pointer-events: none;
      opacity: var(--night-mix);
      background: linear-gradient(
        180deg,
        #0C1224 0%,
        #192440 48%,
        #2D3C61 100%
      );
      box-shadow:
        inset 0 5px 12px rgba(2, 5, 16, 0.85),
        inset 0 -2px 4px rgba(124, 152, 224, 0.22);
    }

    /* Inner recessed viewing cavity (clips miniature world & liquid-glass lens) */
    .capsule-cavity {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 9999px;
      overflow: hidden;
      background-color: #1A2746;
      transform: translateZ(0);
      -webkit-mask-image: -webkit-radial-gradient(white, black);
      z-index: 3;
    }

    /* Main WebGL / Canvas2D render surface inside cavity */
    .scene-canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 9999px;
    }

    /* Recessed ceiling & ambient occlusion inner shadow over the miniature diorama */
    .cavity-depth-shadow {
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      pointer-events: none;
      box-shadow:
        inset 0 7px 12px -5px rgba(12, 20, 42, calc(0.36 + var(--night-mix) * 0.34)),
        inset 0 -5px 10px -5px rgba(12, 20, 42, calc(0.20 + var(--night-mix) * 0.28)),
        inset 5px 0 9px -5px rgba(12, 20, 42, calc(0.20 + var(--night-mix) * 0.22)),
        inset -5px 0 9px -5px rgba(12, 20, 42, calc(0.20 + var(--night-mix) * 0.22));
      z-index: 5;
    }

    /* =========================================================================
       DISCREET SHOWCASE CONTROLS & OPTIONAL QA INSPECTOR
       ========================================================================= */
    .subtle-dock {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px -8px var(--color-shadow);
      transition: background-color 360ms ease, border-color 360ms ease, box-shadow 360ms ease;
    }

    .dock-btn {
      color: var(--color-muted);
      transition: background-color 180ms ease, color 180ms ease;
    }
    .dock-btn:hover {
      color: var(--color-text);
      background-color: rgba(128, 148, 188, 0.14);
    }
    .dock-btn.active {
      color: var(--color-text);
      background-color: rgba(128, 148, 188, 0.22);

    }

    .mono {

    .inspector-panel {

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

    .channel-bar-track {

    }
    .channel-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--color-accent);
      transition: width 40ms linear;
    }
  </style>
</head>

  <!-- =========================================================================
       APPLICATION ARCHITECTURE (MODULAR CLASSES IN SINGLE FILE)
       1. MathUtils & Color Helpers
       2. RealisticAudioEngine (Real-Time Web Audio API Synthesizer + Stream Bus)
       3. LightingEngine (8 Independent Channels + Dual Forward Timelines)
       4. PixelOfficeScene (Single-Source Crisp 222x120 Living Pixel-Art Scene)
       5. LiquidGlassRenderer (WebGL Optical Refraction Shader + Canvas2D Fallback)
       6. ThemeController (DOM, CSS Variables, localStorage, System Sync)
       7. CinematicThemeToggle (Authoritative State Machine, Drag, Keyboard, A11y)
       8. QATestSuite & 9:16 Video Studio
       ========================================================================= -->
  <script>
    'use strict';

    /* =========================================================================
       1. MATH & COLOR UTILITIES
       ========================================================================= */
    const MathUtils = {
      clamp(v, min, max) {
        return v < min ? min : (v > max ? max : v);
      },
      lerp(a, b, t) {
        return a + (b - a) * t;
      },
      smoothstep(edge0, edge1, x) {
        const t = MathUtils.clamp((x - edge0) / (edge1 - edge0), 0, 1);
        return t * t * (3 - 2 * t);
      },
      bell(t, center, width) {
        const d = (t - center) / width;
        return Math.exp(-d * d * 2.6);
      },
      easeLens(t) {
        t = MathUtils.clamp(t, 0, 1);
        if (t === 0 || t === 1) return t;
        const c4 = (2 * Math.PI) / 3.4;
        const cubic = t < 0.5
          ? 4 * t * t * t
          : 1 - Math.pow(-2 * t + 2, 3) / 2;
        const settle = Math.pow(2, -8 * t) * Math.sin((t * 6.5 - 0.75) * c4) * 0.032;
        return MathUtils.clamp(cubic + (t > 0.65 ? settle * (1 - t) * 2.8 : 0), 0, 1.022);
      },
      lerpRGB(c1, c2, t) {
        t = MathUtils.clamp(t, 0, 1);
        return [
          Math.round(c1[0] + (c2[0] - c1[0]) * t),
          Math.round(c1[1] + (c2[1] - c1[1]) * t),
          Math.round(c1[2] + (c2[2] - c1[2]) * t)
        ];
      },
      rgbStr(rgb, a = 1) {
        if (a >= 0.999) return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
        return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a.toFixed(3)})`;
      }
    };

    /* =========================================================================
       2. REALISTIC AUDIO ENGINE (WEB AUDIO API REAL-TIME SYNTHESIS)
          - Velocity-mapped liquid-glass sliding resonance & tactile clicks
          - Magnetic capsule detent snap on settle
          - Mechanical desk-lamp switch click synchronized with lighting channel
          - Subtle office keyboard typing taps synced with pixel worker animation
          - Exposes MediaStreamAudioDestinationNode for 9:16 Video Studio muxing
       ========================================================================= */
    class RealisticAudioEngine {
      constructor() {
        this.enabled = true;
        this.ctx = null;
        this.masterGain = null;
        this.streamDest = null;
        this.noiseBuffer = null;

        this.slideGain = null;
        this.slideFilter = null;
        this.ambienceGain = null;
        this.ambienceFilter = null;

        this._lampWasOn = false;
        this._lastTypeStep = -1;
      }

      unlock() {
        if (!this.enabled) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;

        if (!this.ctx) {
          this.ctx = new AudioCtx();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.value = 0.72;
          this.masterGain.connect(this.ctx.destination);

          if (this.ctx.createMediaStreamDestination) {
            this.streamDest = this.ctx.createMediaStreamDestination();
            this.masterGain.connect(this.streamDest);
          }

          this._createNoiseBuffer();
          this._setupContinuousLayers();
        }

        if (this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      _createNoiseBuffer() {
        const sr = this.ctx.sampleRate;
        const len = sr * 2;
        const buf = this.ctx.createBuffer(1, len, sr);
        const data = buf.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < len; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.997 * b0 + white * 0.029;
          b1 = 0.985 * b1 + white * 0.032;
          b2 = 0.950 * b2 + white * 0.048;
          data[i] = (b0 + b1 + b2 + white * 0.14) * 0.65;
        }
        this.noiseBuffer = buf;
      }

      _setupContinuousLayers() {
        // 1. Velocity-sensitive glass-on-metal sliding friction layer
        const slideSrc = this.ctx.createBufferSource();
        slideSrc.buffer = this.noiseBuffer;
        slideSrc.loop = true;

        this.slideFilter = this.ctx.createBiquadFilter();
        this.slideFilter.type = 'bandpass';
        this.slideFilter.frequency.value = 1400;
        this.slideFilter.Q.value = 3.2;

        this.slideGain = this.ctx.createGain();
        this.slideGain.gain.value = 0.0001;

        slideSrc.connect(this.slideFilter);
        this.slideFilter.connect(this.slideGain);
        this.slideGain.connect(this.masterGain);
        slideSrc.start();

        // 2. Subtle room-tone air bed (warm daytime air <-> quiet deep night hum)
        const ambSrc = this.ctx.createBufferSource();
        ambSrc.buffer = this.noiseBuffer;
        ambSrc.loop = true;

        this.ambienceFilter = this.ctx.createBiquadFilter();
        this.ambienceFilter.type = 'lowpass';
        this.ambienceFilter.frequency.value = 320;

        this.ambienceGain = this.ctx.createGain();
        this.ambienceGain.gain.value = 0.018;

        ambSrc.connect(this.ambienceFilter);
        this.ambienceFilter.connect(this.ambienceGain);
        this.ambienceGain.connect(this.masterGain);
        ambSrc.start();
      }

      setEnabled(flag) {
        this.enabled = Boolean(flag);
        if (this.masterGain && this.ctx) {
          const now = this.ctx.currentTime;
          this.masterGain.gain.setTargetAtTime(this.enabled ? 0.72 : 0.0, now, 0.03);
        }
      }

      getMediaStream() {
        this.unlock();
        return this.streamDest ? this.streamDest.stream : null;
      }

      playClick(isDown = true) {
        if (!this.enabled) return;
        this.unlock();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;

        // Short resonant glass-metal tap
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(isDown ? 1180 : 1460, now);
        osc.frequency.exponentialRampToValueAtTime(isDown ? 360 : 520, now + 0.028);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.14, now + 0.003);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.036);

        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.042);

        // Micro transient noise burst
        const nSrc = this.ctx.createBufferSource();
        nSrc.buffer = this.noiseBuffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 2400;
        const nGain = this.ctx.createGain();
        nGain.gain.setValueAtTime(0.08, now);
        nGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.018);

        nSrc.connect(filter);
        filter.connect(nGain);
        nGain.connect(this.masterGain);
        nSrc.start(now, Math.random() * 1.2, 0.025);
      }

      playSnap(toDark) {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;

        // Soft magnetic detent thud + crystalline glass shimmer
        const thud = this.ctx.createOscillator();
        const thudGain = this.ctx.createGain();
        thud.type = 'sine';
        thud.frequency.setValueAtTime(toDark ? 190 : 230, now);
        thud.frequency.exponentialRampToValueAtTime(72, now + 0.075);

        thudGain.gain.setValueAtTime(0.001, now);
        thudGain.gain.linearRampToValueAtTime(0.18, now + 0.005);
        thudGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.085);

        thud.connect(thudGain);
        thudGain.connect(this.masterGain);
        thud.start(now);
        thud.stop(now + 0.095);

        // Tiny glass ring harmonic
        const chime = this.ctx.createOscillator();
        const chimeGain = this.ctx.createGain();
        chime.type = 'sine';
        chime.frequency.setValueAtTime(toDark ? 1760 : 2093, now);
        chimeGain.gain.setValueAtTime(0.026, now);
        chimeGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);

        chime.connect(chimeGain);
        chimeGain.connect(this.masterGain);
        chime.start(now);
        chime.stop(now + 0.15);
      }

      playLampSwitch(turnOn) {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;

        // Crisp double-stage mechanical desk-lamp switch click
        const clickAt = (offset, freq, amp) => {
          const src = this.ctx.createBufferSource();
          src.buffer = this.noiseBuffer;
          const bp = this.ctx.createBiquadFilter();
          bp.type = 'bandpass';
          bp.frequency.value = freq;
          bp.Q.value = 4.5;
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(amp, now + offset);
          g.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.022);
          src.connect(bp);
          bp.connect(g);
          g.connect(this.masterGain);
          src.start(now + offset, Math.random(), 0.03);
        };

        clickAt(0.0, turnOn ? 2800 : 2100, 0.22);
        clickAt(0.016, turnOn ? 4100 : 1650, 0.15);
      }

      playKeyTap() {
        if (!this.enabled || !this.ctx || this.ctx.state !== 'running') return;
        const now = this.ctx.currentTime;

        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuffer;
        const bp = this.ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 1850 + Math.random() * 900;
        bp.Q.value = 3.5;

        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.024, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.014);

        src.connect(bp);
        bp.connect(g);
        g.connect(this.masterGain);
        src.start(now, Math.random() * 1.4, 0.02);
      }

      updateContinuous(velocity, channels, animTime, reducedMotion) {
        if (!this.enabled || !this.ctx || this.ctx.state !== 'running') return;
        const now = this.ctx.currentTime;

        // 1. Velocity-responsive liquid-glass glide sound
        const speed = MathUtils.clamp(Math.abs(velocity), 0, 1.5);
        const targetSlideGain = speed > 0.02 ? Math.min(0.11, speed * 0.09) : 0.0001;
        const targetSlideFreq = 900 + speed * 1400;
        this.slideGain.gain.setTargetAtTime(targetSlideGain, now, 0.03);
        this.slideFilter.frequency.setTargetAtTime(targetSlideFreq, now, 0.04);

        // 2. Room ambience shifts smoothly between open day air and cozy night tone
        const ambFreq = MathUtils.lerp(420, 185, channels.darkness);
        const ambGain = MathUtils.lerp(0.016, 0.024, channels.darkness);
        this.ambienceFilter.frequency.setTargetAtTime(ambFreq, now, 0.15);
        this.ambienceGain.gain.setTargetAtTime(ambGain, now, 0.15);

        // 3. Synchronized mechanical desk lamp switch click
        const lampIsOn = channels.deskLampEmission > 0.22;
        if (lampIsOn !== this._lampWasOn) {
          this._lampWasOn = lampIsOn;
          this.playLampSwitch(lampIsOn);
        }

        // 4. Subtle mechanical keyboard clicks synchronized with pixel worker typing
        if (!reducedMotion) {
          const isNightFocus = channels.darkness > 0.45;
          const step = Math.floor(animTime * (isNightFocus ? 6.5 : 3.8));
          if (step !== this._lastTypeStep) {
            this._lastTypeStep = step;
            // Realistic irregular cadence (skip occasional beats like natural typing)
            if (Math.random() < (isNightFocus ? 0.55 : 0.30)) {
              this.playKeyTap();
            }
          }
        }
      }

      destroy() {
        if (this.ctx) {
          this.ctx.close().catch(() => {});
          this.ctx = null;
        }
      }
    }

    /* =========================================================================
       3. LIGHTING ENGINE & DUAL FORWARD-TIME SEQUENCES
          - Evaluates 8 independent lighting channels
          - Separates `day_to_night` (sunset) from `night_to_next_day` (sunrise)
       ========================================================================= */
    class LightingEngine {
      constructor() {
        this.channels = this.getRestingChannels('light');
      }

      getRestingChannels(mode) {
        if (mode === 'dark') {
          return {
            ambientDaylight: 0.08,
            sunsetWarmth: 0.00,
            sunriseWarmth: 0.00,
            nightAmbient: 0.45,
            cityWindowEmission: 0.85,
            monitorEmission: 0.80,
            deskLampEmission: 1.00,
            glassReflectionIntensity: 0.35,
            frameReflectionIntensity: 0.25,
            darkness: 1.00
          };
        }
        return {
          ambientDaylight: 1.00,
          sunsetWarmth: 0.00,
          sunriseWarmth: 0.00,
          nightAmbient: 0.00,
          cityWindowEmission: 0.05,
          monitorEmission: 0.15,
          deskLampEmission: 0.00,
          glassReflectionIntensity: 0.90,
          frameReflectionIntensity: 0.85,
          darkness: 0.00
        };
      }

      evaluateDayToNight(p) {
        p = MathUtils.clamp(p, 0, 1);
        const dayDrop = MathUtils.smoothstep(0.18, 0.82, p);
        const sunset = MathUtils.bell(p, 0.44, 0.25);
        const nightRise = MathUtils.smoothstep(0.38, 0.92, p);
        const cityLights = MathUtils.smoothstep(0.45, 0.94, p);
        const monitorRise = MathUtils.smoothstep(0.18, 0.72, p);
        const lampRise = MathUtils.smoothstep(0.46, 0.88, p);
        const reflectDrop = MathUtils.smoothstep(0.22, 0.86, p);

        return {
          ambientDaylight: MathUtils.lerp(1.00, 0.08, dayDrop),
          sunsetWarmth: MathUtils.clamp(sunset * 1.05, 0, 1),
          sunriseWarmth: 0.0,
          nightAmbient: MathUtils.lerp(0.00, 0.45, nightRise),
          cityWindowEmission: MathUtils.lerp(0.05, 0.85, cityLights),
          monitorEmission: MathUtils.lerp(0.15, 0.80, monitorRise),
          deskLampEmission: MathUtils.lerp(0.00, 1.00, lampRise),
          glassReflectionIntensity: MathUtils.lerp(0.90, 0.35, reflectDrop),
          frameReflectionIntensity: MathUtils.lerp(0.85, 0.25, reflectDrop),
          darkness: MathUtils.smoothstep(0.28, 0.88, p)
        };
      }

      evaluateNightToNextDay(p) {
        p = MathUtils.clamp(p, 0, 1);
        const preDawnLift = MathUtils.smoothstep(0.08, 0.76, p);
        const sunrise = MathUtils.bell(p, 0.46, 0.23);
        const nightFade = MathUtils.smoothstep(0.16, 0.78, p);
        const cityFade = MathUtils.smoothstep(0.30, 0.84, p);
        const monitorFade = MathUtils.smoothstep(0.28, 0.82, p);
        const lampFade = MathUtils.smoothstep(0.32, 0.74, p);
        const reflectRise = MathUtils.smoothstep(0.18, 0.84, p);

        return {
          ambientDaylight: MathUtils.lerp(0.08, 1.00, preDawnLift),
          sunsetWarmth: 0.0,
          sunriseWarmth: MathUtils.clamp(sunrise * 0.95, 0, 1),
          nightAmbient: MathUtils.lerp(0.45, 0.00, nightFade),
          cityWindowEmission: MathUtils.lerp(0.85, 0.05, cityFade),
          monitorEmission: MathUtils.lerp(0.80, 0.15, monitorFade),
          deskLampEmission: MathUtils.lerp(1.00, 0.00, lampFade),
          glassReflectionIntensity: MathUtils.lerp(0.35, 0.90, reflectRise),
          frameReflectionIntensity: MathUtils.lerp(0.25, 0.85, reflectRise),
          darkness: 1.0 - MathUtils.smoothstep(0.14, 0.76, p)
        };
      }

      blendChannels(fromCh, toCh, t) {
        const out = {};
        for (const key in toCh) {
          out[key] = MathUtils.lerp(fromCh[key] ?? 0, toCh[key], t);
        }
        return out;
      }

      formatLogicalClock(timeline, progress) {
        let hours = 10.5;
        if (timeline === 'idle_day') hours = 10.5;
        else if (timeline === 'idle_night') hours = 22.5;
        else if (timeline === 'day_to_night') hours = MathUtils.lerp(14.5, 22.5, progress);
        else if (timeline === 'night_to_next_day') hours = MathUtils.lerp(3.5, 9.5, progress);
        const h = Math.floor(hours) % 24;
        const m = Math.floor((hours - Math.floor(hours)) * 60);
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      }
    }

    /* =========================================================================
       4. PIXEL-ART OFFICE SCENE (SINGLE-SOURCE OFFSCREEN RENDERER)
          - High-detail crisp pixel grid: 222 x 120 (exact 1.85:1 aspect)
          - Living environment: drifting clouds, twinkling stars, city traffic,
            working analog wall clock, steaming coffee mug, animated code typing,
            blinking worker, PC tower LEDs, printer standby LED, lamp dust motes
       ========================================================================= */
    class PixelOfficeScene {
      constructor() {
        this.width = 222;
        this.height = 120;

        this.canvas = document.createElement('canvas');
        this.canvas.width = this.width;
        this.canvas.height = this.height;
        this.ctx = this.canvas.getContext('2d', { alpha: false });
        this.ctx.imageSmoothingEnabled = false;

        this.cityBuildings = this._createCityLayout();
        this.stars = this._createStars();
        this.clouds = [
          { x: 6, y: 14, w: 15, speed: 0.9 },
          { x: 36, y: 22, w: 12, speed: 0.65 },
          { x: 52, y: 10, w: 10, speed: 1.15 }
        ];
        this.dustMotes = [
          { bx: 132, by: 62, phase: 0.2, speed: 0.8 },
          { bx: 142, by: 56, phase: 1.9, speed: 0.6 },
          { bx: 126, by: 68, phase: 3.4, speed: 0.7 },
          { bx: 138, by: 66, phase: 4.8, speed: 0.5 }
        ];
      }

      _createStars() {
        const stars = [];
        let seed = 9137;
        const rand = () => {
          seed = (seed * 16807) % 2147483647;
          return (seed - 1) / 2147483646;
        };
        for (let i = 0; i < 22; i++) {
          stars.push({
            x: Math.floor(2 + rand() * 64),
            y: Math.floor(6 + rand() * 26),
            phase: rand() * Math.PI * 2,
            speed: 1.2 + rand() * 2.4
          });
        }
        return stars;
      }

      _createCityLayout() {
        const buildings = [
          { x: 2,  y: 26, w: 13, h: 64, depth: 0, antenna: true,  dayCol: [152, 182, 214], nightCol: [20, 32, 62] },
          { x: 16, y: 16, w: 15, h: 74, depth: 0, antenna: true,  dayCol: [140, 172, 208], nightCol: [18, 29, 56] },
          { x: 32, y: 24, w: 14, h: 66, depth: 0, antenna: false, dayCol: [156, 185, 216], nightCol: [22, 35, 66] },
          { x: 48, y: 19, w: 16, h: 71, depth: 0, antenna: true,  dayCol: [144, 176, 210], nightCol: [19, 31, 59] },
          { x: 0,  y: 38, w: 15, h: 52, depth: 1, antenna: false, dayCol: [118, 150, 186], nightCol: [15, 24, 48] },
          { x: 18, y: 31, w: 17, h: 59, depth: 1, antenna: false, dayCol: [108, 140, 178], nightCol: [14, 22, 44] },
          { x: 38, y: 36, w: 19, h: 54, depth: 1, antenna: false, dayCol: [122, 154, 190], nightCol: [16, 26, 51] },
          { x: 58, y: 42, w: 10, h: 48, depth: 1, antenna: false, dayCol: [114, 146, 182], nightCol: [15, 24, 46] }
        ];

        let seed = 4219;
        const rand = () => {
          seed = (seed * 16807) % 2147483647;
          return (seed - 1) / 2147483646;
        };

        for (const b of buildings) {
          b.windows = [];
          for (let wy = b.y + 4; wy < 86; wy += 5) {
            for (let wx = b.x + 2; wx < b.x + b.w - 3; wx += 4) {
              const r = rand();
              if (r < 0.66) {
                const warmPick = rand();
                const color = warmPick < 0.56
                  ? [255, 224, 130]
                  : (warmPick < 0.84 ? [248, 174, 84] : [138, 208, 255]);
                b.windows.push({
                  x: wx,
                  y: wy,
                  threshold: 0.10 + rand() * 0.72,
                  intensity: 0.62 + rand() * 0.38,
                  color
                });
              }
            }
          }
        }
        return buildings;
      }

      _litColor(dayRGB, nightRGB, ch, warmWeight = 0.25) {
        const t = MathUtils.clamp(ch.darkness, 0, 1);
        let c = MathUtils.lerpRGB(dayRGB, nightRGB, t);
        if (ch.sunsetWarmth > 0.01) {
          c = MathUtils.lerpRGB(c, [242, 150, 82], ch.sunsetWarmth * warmWeight);
        }
        if (ch.sunriseWarmth > 0.01) {
          c = MathUtils.lerpRGB(c, [246, 178, 152], ch.sunriseWarmth * warmWeight);
        }
        return c;
      }

      px(x, y, w, h, rgb, a = 1) {
        this.ctx.fillStyle = MathUtils.rgbStr(rgb, a);
        this.ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
      }

      render(ch, animTime, transitionActivity, reducedMotion, logicalHours = 10.5) {
        this.ctx.imageSmoothingEnabled = false;
        this._drawRoomShell(ch);
        this._drawCityWindow(ch, animTime, reducedMotion);
        this._drawTiledFloor(ch);
        this._drawWallDecorations(ch, logicalHours);
        this._drawRightStorage(ch, animTime, reducedMotion);
        this._drawWorkstationAndWorker(ch, animTime, transitionActivity, reducedMotion);
        this._drawLocalLightSources(ch, animTime, reducedMotion);
      }

      _drawRoomShell(ch) {
        const ceilCol = this._litColor([214, 221, 234], [15, 23, 45], ch, 0.14);
        this.px(0, 0, 222, 11, ceilCol);
        this.px(0, 10, 222, 1, this._litColor([194, 203, 219], [11, 18, 36], ch, 0.12));

        const wallCol = this._litColor([242, 244, 249], [25, 38, 69], ch, 0.22);
        const wallSeam = this._litColor([231, 235, 244], [21, 32, 59], ch, 0.16);
        this.px(68, 11, 154, 79, wallCol);
        this.px(110, 11, 1, 79, wallSeam);
        this.px(158, 11, 1, 79, wallSeam);

        this.px(68, 86, 154, 4, this._litColor([204, 211, 224], [17, 27, 50], ch, 0.16));
        this.px(68, 86, 154, 1, this._litColor([224, 229, 238], [26, 39, 70], ch, 0.14));

        const pillarCol = this._litColor([208, 216, 230], [21, 33, 60], ch, 0.20);
        this.px(66, 9, 5, 83, pillarCol);
        this.px(70, 9, 1, 83, this._litColor([180, 191, 210], [14, 22, 42], ch, 0.12));

        const lightFixture = this._litColor([252, 254, 255], [30, 44, 76], ch, 0.10);
        this.px(98, 4, 44, 3, lightFixture);
        this.px(100, 7, 40, 1, this._litColor([236, 242, 252], [22, 34, 62], ch, 0.10));
      }

      _drawCityWindow(ch, animTime, reducedMotion) {
        const skyTopDay = [146, 198, 244];
        const skyBotDay = [210, 234, 252];
        const skyTopNight = [10, 17, 40];
        const skyBotNight = [22, 36, 72];

        let topCol = MathUtils.lerpRGB(skyTopDay, skyTopNight, ch.darkness);
        let botCol = MathUtils.lerpRGB(skyBotDay, skyBotNight, ch.darkness);

        if (ch.sunsetWarmth > 0.01) {
          topCol = MathUtils.lerpRGB(topCol, [116, 98, 166], ch.sunsetWarmth * 0.68);
          botCol = MathUtils.lerpRGB(botCol, [254, 152, 74], ch.sunsetWarmth * 0.94);
        }
        if (ch.sunriseWarmth > 0.01) {
          topCol = MathUtils.lerpRGB(topCol, [112, 148, 210], ch.sunriseWarmth * 0.58);
          botCol = MathUtils.lerpRGB(botCol, [255, 190, 156], ch.sunriseWarmth * 0.90);
        }

        for (let y = 6; y < 90; y += 2) {
          const gy = (y - 6) / 84;
          this.px(0, y, 66, 2, MathUtils.lerpRGB(topCol, botCol, gy));
        }

        if (ch.darkness > 0.45) {
          const starVis = MathUtils.smoothstep(0.45, 0.85, ch.darkness);
          for (const st of this.stars) {
            const tw = reducedMotion ? 0.8 : (0.45 + 0.55 * Math.sin(animTime * st.speed + st.phase));
            this.px(st.x, st.y, 1, 1, [224, 236, 255], starVis * tw * 0.85);
          }
        }

        if (ch.ambientDaylight > 0.12 || ch.sunsetWarmth > 0.1 || ch.sunriseWarmth > 0.1) {
          let cloudCol = [248, 252, 255];
          if (ch.sunsetWarmth > 0.05) cloudCol = MathUtils.lerpRGB(cloudCol, [255, 198, 138], ch.sunsetWarmth * 0.85);
          if (ch.sunriseWarmth > 0.05) cloudCol = MathUtils.lerpRGB(cloudCol, [255, 214, 200], ch.sunriseWarmth * 0.85);
          const cAlpha = MathUtils.clamp(ch.ambientDaylight * 0.72 + (ch.sunsetWarmth + ch.sunriseWarmth) * 0.45, 0, 0.8);

          for (const cl of this.clouds) {
            const cx = reducedMotion ? cl.x : ((cl.x + animTime * cl.speed) % 82) - 16;
            this.px(cx, cl.y, cl.w, 3, cloudCol, cAlpha);
            this.px(cx + 3, cl.y - 2, cl.w - 6, 2, cloudCol, cAlpha * 0.9);
          }
        }

        this.px(0, 72, 66, 18, MathUtils.lerpRGB(botCol, [255, 255, 255], 0.16 * ch.ambientDaylight), 0.32);

        for (const b of this.cityBuildings) {
          let bCol = MathUtils.lerpRGB(b.dayCol, b.nightCol, ch.darkness);
          if (ch.sunsetWarmth > 0.01) {
