          ctx.restore();
        }

        if (ch.deskLampEmission > 0.02) {
          const e = ch.deskLampEmission;
          const shimmer = 0.985 + 0.015 * Math.sin(animTime * 3.1);
          const intensity = e * shimmer;

          ctx.save();
          ctx.globalCompositeOperation = 'screen';

          const outerGrad = ctx.createRadialGradient(134, 61, 3, 134, 66, 52);
          outerGrad.addColorStop(0.00, `rgba(255, 240, 168, ${(0.84 * intensity).toFixed(3)})`);
          outerGrad.addColorStop(0.24, `rgba(255, 214, 111, ${(0.56 * intensity).toFixed(3)})`);
          outerGrad.addColorStop(0.54, `rgba(245, 173, 72, ${(0.25 * intensity).toFixed(3)})`);
          outerGrad.addColorStop(0.84, `rgba(224, 128, 44, ${(0.08 * intensity).toFixed(3)})`);
          outerGrad.addColorStop(1.00, 'rgba(224, 128, 44, 0)');
          ctx.fillStyle = outerGrad;
          ctx.fillRect(78, 20, 118, 98);

          const coneGrad = ctx.createRadialGradient(134, 68, 2, 134, 68, 17);
          coneGrad.addColorStop(0, `rgba(255, 244, 196, ${(0.78 * intensity).toFixed(3)})`);
          coneGrad.addColorStop(0.55, `rgba(255, 214, 111, ${(0.38 * intensity).toFixed(3)})`);
          coneGrad.addColorStop(1, 'rgba(245, 173, 72, 0)');
          ctx.fillStyle = coneGrad;
          ctx.fillRect(114, 52, 40, 32);

          ctx.restore();

          if (!reducedMotion && e > 0.35) {
            const moteA = MathUtils.smoothstep(0.35, 0.9, e) * 0.65;
            for (const m of this.dustMotes) {
              const mx = m.bx + Math.sin(animTime * m.speed + m.phase) * 4;
              const my = m.by + Math.cos(animTime * m.speed * 0.7 + m.phase) * 3;
              this.px(mx, my, 1, 1, [255, 242, 192], moteA);
            }
          }
        }
      }
    }

    /* =========================================================================
       5. LIQUID GLASS LENS RENDERER (PHYSICALLY INSPIRED WEBGL REFRACTION)
       ========================================================================= */
    class LiquidGlassRenderer {
      constructor(displayCanvas, scene) {
        this.canvas = displayCanvas;
        this.scene = scene;
        this.mode = 'webgl';
        this.gl = null;
        this.ctx2d = null;
        this.program = null;
        this.texture = null;
        this.uniforms = {};
        this.disposed = false;

        this._initContext();
      }

      _initContext() {
        try {
          const gl = this.canvas.getContext('webgl', {
            alpha: false,
            antialias: true,
            powerPreference: 'high-performance',
            preserveDrawingBuffer: true
          });
          if (gl) {
            this.gl = gl;
            this.mode = 'webgl';
            this._setupWebGL(gl);
            return;
          }
        } catch (err) {
          // Fall back to Canvas2D refraction below
        }
        this.mode = 'canvas2d';
        this.ctx2d = this.canvas.getContext('2d', { alpha: false });
      }

      _compileShader(gl, type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          const log = gl.getShaderInfoLog(shader);
          gl.deleteShader(shader);
          throw new Error('Shader compile failed: ' + log);
        }
        return shader;
      }

      _setupWebGL(gl) {
        const vsSource = `
          attribute vec2 aPos;
          varying vec2 vUv;
          void main() {
            vUv = vec2(aPos.x * 0.5 + 0.5, 0.5 - aPos.y * 0.5);
            gl_Position = vec4(aPos, 0.0, 1.0);
          }
        `;

        const fsSource = `
          precision highp float;
          varying vec2 vUv;

          uniform sampler2D uScene;
          uniform vec2 uResolution;
          uniform vec2 uSceneSize;
          uniform float uLensX;
          uniform float uLensRadius;
          uniform float uStretchX;
          uniform float uVelocity;
          uniform float uGlassReflect;
          uniform float uDarkness;
          uniform float uLampEmission;
          uniform float uSunsetWarmth;
          uniform float uSunriseWarmth;

          vec3 samplePixel(vec2 uv) {
            vec2 clamped = clamp(uv, vec2(0.002), vec2(0.998));
            vec2 snapped = (floor(clamped * uSceneSize) + 0.5) / uSceneSize;
            return texture2D(uScene, snapped).rgb;
          }

          vec3 sampleOptical(vec2 uv, float softness) {
            vec3 crisp = samplePixel(uv);
            vec3 linear = texture2D(uScene, clamp(uv, vec2(0.002), vec2(0.998))).rgb;
            return mix(crisp, linear, softness);
          }

          void main() {
            float aspect = uResolution.x / max(uResolution.y, 1.0);
            vec2 lensCenter = vec2(uLensX, 0.5);

            vec2 rel = vec2((vUv.x - lensCenter.x) * aspect, vUv.y - lensCenter.y);
            vec2 relStretched = vec2(rel.x / uStretchX, rel.y);
            float dist = length(relStretched);
            float rNorm = dist / uLensRadius;

            vec3 baseColor = samplePixel(vUv);

            vec2 shadowRel = vec2(((vUv.x - lensCenter.x) * aspect - 0.012) / uStretchX, (vUv.y - lensCenter.y) - 0.032);
            float shadowDist = length(shadowRel) / uLensRadius;
            if (rNorm >= 1.0) {
              float castShadow = (1.0 - smoothstep(0.96, 1.24, shadowDist)) * (0.28 + uDarkness * 0.24);
              float causticSpot = (1.0 - smoothstep(0.98, 1.16, shadowDist)) * smoothstep(0.86, 1.02, shadowDist);
              vec3 causticTint = mix(vec3(0.92, 0.96, 1.0), vec3(0.62, 0.78, 1.0), uDarkness);
              baseColor = baseColor * (1.0 - castShadow) + causticTint * causticSpot * (0.14 * (1.0 - uDarkness * 0.55));
              gl_FragColor = vec4(baseColor, 1.0);
              return;
            }

            vec2 dir = dist > 0.0001 ? (relStretched / dist) : vec2(0.0);
            float z = sqrt(max(0.001, 1.0 - rNorm * rNorm));
            vec3 normal = normalize(vec3(relStretched / uLensRadius, z * 0.82));

            float centerMag = 0.83;
            float rimWrap = pow(smoothstep(0.58, 1.0, rNorm), 2.15) * 0.46;
            float radialScale = mix(centerMag, 0.42, rimWrap);

            vec2 refractedRel = relStretched * radialScale;
            vec2 edgePull = -normal.xy * pow(rNorm, 3.2) * uLensRadius * 0.16;
            vec2 refractedUv = lensCenter + vec2((refractedRel.x + edgePull.x) * uStretchX / aspect, refractedRel.y + edgePull.y);

            float caStrength = pow(rNorm, 3.0) * 0.011 * (0.85 + 0.35 * uGlassReflect);
            vec2 caOffset = vec2(dir.x / aspect, dir.y) * caStrength;
            float edgeSoft = smoothstep(0.76, 1.0, rNorm) * 0.45;

            float colR = sampleOptical(refractedUv + caOffset, edgeSoft).r;
            float colG = sampleOptical(refractedUv, edgeSoft * 0.5).g;
            float colB = sampleOptical(refractedUv - caOffset, edgeSoft).b;
            vec3 glassColor = vec3(colR, colG, colB);

            vec3 dayGlassTint = vec3(0.95, 0.98, 1.0);
            vec3 nightGlassTint = vec3(0.76, 0.85, 1.0);
            vec3 volumeTint = mix(dayGlassTint, nightGlassTint, uDarkness);
            float thicknessShade = smoothstep(0.72, 1.0, rNorm) * (0.14 + uDarkness * 0.14);
            glassColor = glassColor * mix(vec3(1.0), volumeTint, 0.18 + rNorm * 0.25) * (1.0 - thicknessShade);

            float fresnel = pow(1.0 - clamp(normal.z, 0.0, 1.0), 2.8);
            vec3 envReflectCol = mix(vec3(0.92, 0.96, 1.0), vec3(0.42, 0.56, 0.92), uDarkness);
            if (uSunsetWarmth > 0.02) {
              envReflectCol = mix(envReflectCol, vec3(1.0, 0.78, 0.54), uSunsetWarmth * 0.45);
            }
            if (uSunriseWarmth > 0.02) {
              envReflectCol = mix(envReflectCol, vec3(1.0, 0.82, 0.76), uSunriseWarmth * 0.42);
            }
            glassColor += envReflectCol * fresnel * (0.42 * uGlassReflect + 0.12);

            vec2 lightDirTop = normalize(vec3(-0.24 - uVelocity * 0.08, -0.78, 0.68)).xy;
            float topCrescent = smoothstep(0.78, 0.96, dot(normalize(relStretched + vec2(0.0001)), lightDirTop))
                              * smoothstep(0.62, 0.88, rNorm)
                              * (1.0 - smoothstep(0.93, 0.995, rNorm));
            glassColor += vec3(1.0, 0.99, 1.0) * topCrescent * (0.62 * uGlassReflect + 0.14);

            vec2 domePos = (relStretched / uLensRadius) - vec2(-0.14 - uVelocity * 0.04, -0.44);
            float upperDome = exp(-dot(domePos * vec2(1.4, 2.6), domePos * vec2(1.4, 2.6)) * 5.2);
            glassColor += vec3(0.96, 0.98, 1.0) * upperDome * (0.20 * uGlassReflect + 0.04);

            vec2 lightDirBot = normalize(vec2(0.18, 0.86));
            float botArc = smoothstep(0.70, 0.95, dot(normalize(relStretched + vec2(0.0001)), lightDirBot))
                         * smoothstep(0.72, 0.92, rNorm)
                         * (1.0 - smoothstep(0.95, 1.0, rNorm));
            vec3 botCol = mix(vec3(0.86, 0.94, 1.0), vec3(0.48, 0.66, 1.0), uDarkness);
            glassColor += botCol * botArc * (0.44 * uGlassReflect + 0.14);

            if (uLampEmission > 0.02) {
              float lampScreenX = 134.0 / 222.0;
              float lampDelta = clamp((lampScreenX - uLensX) * 2.2, -0.7, 0.7);
              vec2 lampReflPos = (relStretched / uLensRadius) - vec2(lampDelta * 0.65, 0.18);
              float lampGlint = exp(-dot(lampReflPos, lampReflPos) * 7.0) * smoothstep(0.25, 0.95, rNorm);
              glassColor += vec3(1.0, 0.82, 0.44) * lampGlint * uLampEmission * 0.36;
            }

            float rimLine = smoothstep(0.945, 0.982, rNorm) * (1.0 - smoothstep(0.985, 1.0, rNorm));
            vec3 rimCol = mix(vec3(1.0, 1.0, 1.0), vec3(0.64, 0.78, 1.0), uDarkness);
            glassColor += rimCol * rimLine * (0.58 * uGlassReflect + 0.20);

            float aaEdge = 1.0 - smoothstep(0.982, 1.0, rNorm);
            vec3 finalColor = mix(baseColor, glassColor, aaEdge);
            gl_FragColor = vec4(finalColor, 1.0);
          }
        `;

        const vs = this._compileShader(gl, gl.VERTEX_SHADER, vsSource);
        const fs = this._compileShader(gl, gl.FRAGMENT_SHADER, fsSource);
        const prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
          throw new Error('Program link failed: ' + gl.getProgramInfoLog(prog));
        }

        this.program = prog;
        gl.useProgram(prog);

        const quad = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
        const aPos = gl.getAttribLocation(prog, 'aPos');
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
        this.vertexBuffer = buf;

        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        this.texture = tex;

        this.uniforms = {
          uScene: gl.getUniformLocation(prog, 'uScene'),
          uResolution: gl.getUniformLocation(prog, 'uResolution'),
          uSceneSize: gl.getUniformLocation(prog, 'uSceneSize'),
          uLensX: gl.getUniformLocation(prog, 'uLensX'),
          uLensRadius: gl.getUniformLocation(prog, 'uLensRadius'),
          uStretchX: gl.getUniformLocation(prog, 'uStretchX'),
          uVelocity: gl.getUniformLocation(prog, 'uVelocity'),
          uGlassReflect: gl.getUniformLocation(prog, 'uGlassReflect'),
          uDarkness: gl.getUniformLocation(prog, 'uDarkness'),
          uLampEmission: gl.getUniformLocation(prog, 'uLampEmission'),
          uSunsetWarmth: gl.getUniformLocation(prog, 'uSunsetWarmth'),
          uSunriseWarmth: gl.getUniformLocation(prog, 'uSunriseWarmth')
        };
      }

      resize(cssWidth, cssHeight) {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = Math.max(1, Math.round(cssWidth * dpr));
        const h = Math.max(1, Math.round(cssHeight * dpr));
        if (this.canvas.width !== w || this.canvas.height !== h) {
          this.canvas.width = w;
          this.canvas.height = h;
        }
        if (this.gl) {
          this.gl.viewport(0, 0, w, h);
        }
      }

      render(state) {
        if (this.disposed) return;
        const { lensProgress, stretchX, velocity, channels } = state;

        const aspect = this.canvas.width / Math.max(this.canvas.height, 1);
        const radiusV = 0.42;
        const marginX = (radiusV + 0.055) / aspect;
        const lensX = MathUtils.lerp(marginX, 1.0 - marginX, lensProgress);

        if (this.mode === 'webgl' && this.gl) {
          const gl = this.gl;
          gl.useProgram(this.program);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, this.texture);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, this.scene.canvas);

          gl.uniform1i(this.uniforms.uScene, 0);
          gl.uniform2f(this.uniforms.uResolution, this.canvas.width, this.canvas.height);
          gl.uniform2f(this.uniforms.uSceneSize, this.scene.width, this.scene.height);
          gl.uniform1f(this.uniforms.uLensX, lensX);
          gl.uniform1f(this.uniforms.uLensRadius, radiusV);
          gl.uniform1f(this.uniforms.uStretchX, stretchX);
          gl.uniform1f(this.uniforms.uVelocity, velocity);
          gl.uniform1f(this.uniforms.uGlassReflect, channels.glassReflectionIntensity);
          gl.uniform1f(this.uniforms.uDarkness, channels.darkness);
          gl.uniform1f(this.uniforms.uLampEmission, channels.deskLampEmission);
          gl.uniform1f(this.uniforms.uSunsetWarmth, channels.sunsetWarmth);
          gl.uniform1f(this.uniforms.uSunriseWarmth, channels.sunriseWarmth);

          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        } else if (this.ctx2d) {
          this._render2DFallback(lensX, radiusV, stretchX, channels);
        }
      }

      _render2DFallback(lensX, radiusV, stretchX, ch) {
        const ctx = this.ctx2d;
        const W = this.canvas.width;
        const H = this.canvas.height;

        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(this.scene.canvas, 0, 0, W, H);

        const cx = lensX * W;
        const cy = H * 0.5;
        const r = radiusV * H;

        ctx.save();
        ctx.beginPath();
        ctx.ellipse(cx + 3, cy + 7, r * stretchX * 1.03, r * 1.03, 0, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(8, 14, 32, ${(0.22 + ch.darkness * 0.24).toFixed(3)})`;
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.ellipse(cx, cy, r * stretchX, r, 0, 0, Math.PI * 2);
        ctx.clip();

        const mag = 1.24;
        const srcW = (r * 2 / W) * this.scene.width / mag;
        const srcH = (r * 2 / H) * this.scene.height / mag;
        const srcX = MathUtils.clamp(lensX * this.scene.width - srcW * 0.5, 0, this.scene.width - srcW);
        const srcY = MathUtils.clamp(0.5 * this.scene.height - srcH * 0.5, 0, this.scene.height - srcH);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(this.scene.canvas, srcX, srcY, srcW, srcH, cx - r * stretchX, cy - r, r * 2 * stretchX, r * 2);

        const rimGrad = ctx.createRadialGradient(cx, cy, r * 0.62, cx, cy, r);
        rimGrad.addColorStop(0, 'rgba(255,255,255,0)');
        rimGrad.addColorStop(0.82, `rgba(210,232,255,${(0.18 * ch.glassReflectionIntensity).toFixed(3)})`);
        rimGrad.addColorStop(1, `rgba(255,255,255,${(0.55 * ch.glassReflectionIntensity + 0.15).toFixed(3)})`);
        ctx.fillStyle = rimGrad;
        ctx.fillRect(cx - r * stretchX, cy - r, r * 2 * stretchX, r * 2);

        ctx.beginPath();
        ctx.ellipse(cx - r * 0.12, cy - r * 0.52, r * 0.52, r * 0.18, -0.18, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${(0.32 * ch.glassReflectionIntensity + 0.08).toFixed(3)})`;
        ctx.fill();
        ctx.restore();
      }

      dispose() {
        this.disposed = true;
        if (this.gl) {
          if (this.texture) this.gl.deleteTexture(this.texture);
          if (this.vertexBuffer) this.gl.deleteBuffer(this.vertexBuffer);
          if (this.program) this.gl.deleteProgram(this.program);
        }
      }
    }

    /* =========================================================================
       6. THEME CONTROLLER (DOM, CSS VARIABLES, STORAGE & SYSTEM PREFERENCE SYNC)
       ========================================================================= */
    class ThemeController {
      constructor(onExternalChange) {
        this.storageKey = 'cinematic-toggle-theme';
        this.onExternalChange = onExternalChange || (() => {});
        this.theme = this._readInitialTheme();
        this._applyToDOM(this.theme);

        this._mediaQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
        this._onMediaChange = (e) => {
          try {
            if (!localStorage.getItem(this.storageKey)) {
              const next = e.matches ? 'dark' : 'light';
              this.setTheme(next, false);
              this.onExternalChange(next);
            }
          } catch (_) {}
        };
        if (this._mediaQuery && this._mediaQuery.addEventListener) {
          this._mediaQuery.addEventListener('change', this._onMediaChange);
        }

        this._onStorage = (e) => {
          if (e.key === this.storageKey && (e.newValue === 'light' || e.newValue === 'dark')) {
            this.setTheme(e.newValue, false);
            this.onExternalChange(e.newValue);
          }
        };
        window.addEventListener('storage', this._onStorage);
      }

      _readInitialTheme() {
        const attr = document.documentElement.getAttribute('data-theme');
        if (attr === 'light' || attr === 'dark') return attr;
        try {
          const saved = localStorage.getItem(this.storageKey);
          if (saved === 'light' || saved === 'dark') return saved;
        } catch (_) {}
        return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }

      _applyToDOM(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.toggle('dark', theme === 'dark');
      }

      setTheme(theme, persist = true) {
        if (theme !== 'light' && theme !== 'dark') return;
        this.theme = theme;
        this._applyToDOM(theme);
        if (persist) {
          try {
            localStorage.setItem(this.storageKey, theme);
          } catch (_) {}
        }
      }

      destroy() {
        if (this._mediaQuery && this._mediaQuery.removeEventListener) {
          this._mediaQuery.removeEventListener('change', this._onMediaChange);
        }
        window.removeEventListener('storage', this._onStorage);
      }
    }

    /* =========================================================================
       7. CINEMATIC THEME TOGGLE (AUTHORITATIVE STATE MACHINE, DRAG, A11Y, rAF)
       ========================================================================= */
    class CinematicThemeToggle {
      constructor(options) {
        this.buttonEl = options.buttonEl;
        this.canvasEl = options.canvasEl;
        this.srStatusEl = options.srStatusEl;
        this.audio = options.audio || null;
        this.onThemeChange = options.onThemeChange || (() => {});
        this.onTelemetry = options.onTelemetry || (() => {});
        this.onAfterRender = options.onAfterRender || null;

        this.animationDuration = options.animationDuration || 1400;
        this.enableDrag = options.enableDrag !== false;
        this.reducedMotionSetting = options.reducedMotion !== undefined ? options.reducedMotion : 'system';
        this.disabled = Boolean(options.disabled);

        this.theme = options.initialTheme === 'dark' ? 'dark' : 'light';
        this.phase = this.theme === 'dark' ? 'idle_night' : 'idle_day';
        this.lensProgress = this.theme === 'dark' ? 1.0 : 0.0;
        this.lensVelocity = 0.0;

        this.lighting = new LightingEngine();
        this.channels = this.lighting.getRestingChannels(this.theme);
        this.scene = new PixelOfficeScene();
        this.renderer = new LiquidGlassRenderer(this.canvasEl, this.scene);

        this.transition = null;
        this.dragState = null;

        this._rafId = null;
        this._lastFrameTime = performance.now();
        this._frameTimeMs = 16.6;
        this._animTime = 0;
        this._isPageHidden = document.hidden;

        this._syncAria();
        this._syncHousingCSS(this.channels);
        this._bindEvents();
        this._handleResize();
        this._startLoop();
      }

      isReducedMotion() {
        if (this.reducedMotionSetting === true) return true;
        if (this.reducedMotionSetting === false) return false;
        return Boolean(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      }

      setSize(sizeName) {
        const sizes = {
          small:  { w: '180px', h: '98px' },
          medium: { w: '340px', h: '184px' },
          large:  { w: '440px', h: '238px' }
        };
        const s = sizes[sizeName] || sizes.large;
        document.documentElement.style.setProperty('--toggle-width', s.w);
        document.documentElement.style.setProperty('--toggle-height', s.h);
        requestAnimationFrame(() => this._handleResize());
      }

      setDisabled(isDisabled) {
        this.disabled = Boolean(isDisabled);
        this.buttonEl.setAttribute('aria-disabled', String(this.disabled));
      }

      toggle() {
        if (this.disabled) return;
        const next = this.theme === 'dark' ? 'light' : 'dark';
        this.transitionTo(next, true);
      }

      scrubLens(nextProgress, forwardTimeline = 'day_to_night') {
        this.transition = null;
        const clamped = MathUtils.clamp(nextProgress, 0, 1);
        this.lensVelocity = MathUtils.clamp((clamped - this.lensProgress) * 18, -1.4, 1.4);
        this.lensProgress = clamped;
        this.phase = forwardTimeline;
        this.channels = forwardTimeline === 'day_to_night'
          ? this.lighting.evaluateDayToNight(clamped)
          : this.lighting.evaluateNightToNextDay(1 - clamped);
        this._syncHousingCSS(this.channels);
      }

      transitionTo(targetTheme, emitChange = true) {
        if (targetTheme !== 'light' && targetTheme !== 'dark') return;
        this.theme = targetTheme;
        this._syncAria();

        if (emitChange) {
          this.onThemeChange(targetTheme);
        }

        if (this.isReducedMotion()) {
          this.transition = null;
          this.lensProgress = targetTheme === 'dark' ? 1.0 : 0.0;
          this.lensVelocity = 0.0;
          this.phase = targetTheme === 'dark' ? 'idle_night' : 'idle_day';
          this.channels = this.lighting.getRestingChannels(targetTheme);
          this._syncHousingCSS(this.channels);
          return;
        }

        const timeline = targetTheme === 'dark' ? 'day_to_night' : 'night_to_next_day';
        this.phase = timeline;

        this.transition = {
          startTime: performance.now(),
          duration: this.animationDuration,
          timeline,
          fromLens: this.lensProgress,
          toLens: targetTheme === 'dark' ? 1.0 : 0.0,
          fromChannels: { ...this.channels },
          targetTheme,
          snapped: false
        };
      }

      _syncAria() {
        const isDark = this.theme === 'dark';
        this.buttonEl.setAttribute('aria-checked', String(isDark));
        if (this.srStatusEl) {
          this.srStatusEl.textContent = isDark ? 'Dark theme enabled' : 'Light theme enabled';
        }
      }

      _syncHousingCSS(ch) {
        const rootStyle = document.documentElement.style;
        rootStyle.setProperty('--night-mix', ch.darkness.toFixed(3));
        rootStyle.setProperty('--frame-reflect', ch.frameReflectionIntensity.toFixed(3));
      }

      _bindEvents() {
        this._onKeyDown = (e) => {
          if (this.disabled) return;
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            if (this.audio) this.audio.playClick(true);
            this.toggle();
          }
        };
        this.buttonEl.addEventListener('keydown', this._onKeyDown);

        this._onPointerDown = (e) => {
          if (this.disabled || (e.pointerType === 'mouse' && e.button !== 0)) return;
          if (this.audio) this.audio.playClick(true);
          if (!this.enableDrag) {
            this.toggle();
            return;
          }
          this.buttonEl.setPointerCapture(e.pointerId);
          const rect = this.buttonEl.getBoundingClientRect();
          this.dragState = {
            pointerId: e.pointerId,
            startX: e.clientX,
            startProgress: this.lensProgress,
            moved: false,
            rect,
            direction: this.theme === 'light' ? 'day_to_night' : 'night_to_next_day'
          };
        };

        this._onPointerMove = (e) => {
          if (!this.dragState || e.pointerId !== this.dragState.pointerId) return;
          const dx = e.clientX - this.dragState.startX;
          if (!this.dragState.moved && Math.abs(dx) > 6) {
            this.dragState.moved = true;
            this.transition = null;
          }
          if (!this.dragState.moved) return;

          const travelPx = Math.max(40, this.dragState.rect.width * 0.52);
          const next = MathUtils.clamp(this.dragState.startProgress + dx / travelPx, 0, 1);
          this.lensVelocity = MathUtils.clamp((next - this.lensProgress) * 16, -1.5, 1.5);
          this.lensProgress = next;

          const dir = this.dragState.direction;
          this.phase = dir;
          this.channels = dir === 'day_to_night'
            ? this.lighting.evaluateDayToNight(next)
            : this.lighting.evaluateNightToNextDay(1.0 - next);
          this._syncHousingCSS(this.channels);
        };

        this._onPointerUp = (e) => {
          if (!this.dragState || e.pointerId !== this.dragState.pointerId) return;
          const wasDrag = this.dragState.moved;
          this.dragState = null;
          if (this.buttonEl.hasPointerCapture(e.pointerId)) {
            this.buttonEl.releasePointerCapture(e.pointerId);
          }
          if (!wasDrag) {
            this.toggle();
          } else {
            if (this.audio) this.audio.playClick(false);
            const target = this.lensProgress >= 0.5 ? 'dark' : 'light';
            this.transitionTo(target, true);
          }
        };

        this._onPointerCancel = (e) => {
          if (!this.dragState || e.pointerId !== this.dragState.pointerId) return;
          this.dragState = null;
          this.transitionTo(this.theme, false);
        };

        this.buttonEl.addEventListener('pointerdown', this._onPointerDown);
        this.buttonEl.addEventListener('pointermove', this._onPointerMove);
        this.buttonEl.addEventListener('pointerup', this._onPointerUp);
        this.buttonEl.addEventListener('pointercancel', this._onPointerCancel);

        this._onResize = () => this._handleResize();
        window.addEventListener('resize', this._onResize);

        if (typeof ResizeObserver !== 'undefined') {
          this._resizeObserver = new ResizeObserver(() => this._handleResize());
          this._resizeObserver.observe(this.canvasEl);
        }

        this._onVisibility = () => {
          this._isPageHidden = document.hidden;
          if (!document.hidden) {
            this._lastFrameTime = performance.now();
          }
        };
        document.addEventListener('visibilitychange', this._onVisibility);
      }

      _handleResize() {
        const rect = this.canvasEl.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          this.renderer.resize(rect.width, rect.height);
        }
      }

      _startLoop() {
        const step = (now) => {
          this._rafId = requestAnimationFrame(step);
          if (this._isPageHidden) return;

          const dtMs = Math.min(64, Math.max(1, now - this._lastFrameTime));
          this._lastFrameTime = now;
          this._frameTimeMs = this._frameTimeMs * 0.9 + dtMs * 0.1;
          this._animTime += dtMs / 1000;

          this._update(now, dtMs / 1000);
          this._renderFrame(now);
        };
        this._rafId = requestAnimationFrame(step);
      }

      _update(now, dtSec) {
        if (this.transition) {
          const tr = this.transition;
          const rawP = MathUtils.clamp((now - tr.startTime) / tr.duration, 0, 1);

          const lensRaw = MathUtils.clamp(rawP / 0.78, 0, 1);
          const easedLens = MathUtils.easeLens(lensRaw);
          const nextLens = MathUtils.clamp(MathUtils.lerp(tr.fromLens, tr.toLens, easedLens), 0, 1);
          this.lensVelocity = (nextLens - this.lensProgress) / Math.max(0.008, dtSec) * 0.25;
          this.lensProgress = nextLens;

          if (!tr.snapped && lensRaw >= 0.96) {
            tr.snapped = true;
            if (this.audio) this.audio.playSnap(tr.targetTheme === 'dark');
          }

          const targetCh = tr.timeline === 'day_to_night'
            ? this.lighting.evaluateDayToNight(rawP)
            : this.lighting.evaluateNightToNextDay(rawP);
          const blendIn = MathUtils.smoothstep(0.0, 0.22, rawP);
          this.channels = this.lighting.blendChannels(tr.fromChannels, targetCh, blendIn);
          this._syncHousingCSS(this.channels);

          if (rawP >= 1.0) {
            this.lensProgress = tr.toLens;
            this.lensVelocity = 0.0;
            this.phase = tr.targetTheme === 'dark' ? 'idle_night' : 'idle_day';
            this.channels = this.lighting.getRestingChannels(tr.targetTheme);
            this._syncHousingCSS(this.channels);
            this.transition = null;
          }
        } else if (!this.dragState) {
          this.lensVelocity *= 0.85;
        }

        if (this.audio) {
          this.audio.updateContinuous(this.lensVelocity, this.channels, this._animTime, this.isReducedMotion());
        }
      }

      _renderFrame(now) {
        const rawP = this.transition
          ? MathUtils.clamp((now - this.transition.startTime) / this.transition.duration, 0, 1)
          : (this.theme === 'dark' ? 1 : 0);

        let logicalHours = 10.5;
        if (this.phase === 'idle_day') logicalHours = 10.5 + (this._animTime * 0.002);
        else if (this.phase === 'idle_night') logicalHours = 22.5 + (this._animTime * 0.002);
        else if (this.phase === 'day_to_night') logicalHours = MathUtils.lerp(14.5, 22.5, rawP);
        else if (this.phase === 'night_to_next_day') logicalHours = MathUtils.lerp(3.5, 9.5, rawP);

        const transitionActivity = this.transition ? Math.sin(rawP * Math.PI) : 0;

        this.scene.render(this.channels, this._animTime, transitionActivity, this.isReducedMotion(), logicalHours);

        const stretchX = 1.0 + Math.min(0.028, Math.abs(this.lensVelocity) * 0.026);
        this.renderer.render({
          lensProgress: this.lensProgress,
          stretchX,
          velocity: this.lensVelocity,
          channels: this.channels
        });

        this.onTelemetry({
          theme: this.theme,
          phase: this.phase,
          lensProgress: this.lensProgress,
          logicalClock: this.lighting.formatLogicalClock(this.phase, rawP),
          frameTimeMs: this._frameTimeMs,
          renderMode: this.renderer.mode,
          channels: this.channels
        });

        if (this.onAfterRender) {
          this.onAfterRender(this);
        }
      }

      destroy() {
        if (this._rafId) cancelAnimationFrame(this._rafId);
        this.buttonEl.removeEventListener('keydown', this._onKeyDown);
        this.buttonEl.removeEventListener('pointerdown', this._onPointerDown);
        this.buttonEl.removeEventListener('pointermove', this._onPointerMove);
        this.buttonEl.removeEventListener('pointerup', this._onPointerUp);
        this.buttonEl.removeEventListener('pointercancel', this._onPointerCancel);
        window.removeEventListener('resize', this._onResize);
        document.removeEventListener('visibilitychange', this._onVisibility);
        if (this._resizeObserver) this._resizeObserver.disconnect();
        this.renderer.dispose();
      }
    }

    /* =========================================================================
       8. AUTOMATED QA & INVARIANT TEST SUITE
       ========================================================================= */
    function runQATests(toggle, themeCtrl) {
      const results = [];
      const savedTheme = toggle.theme;
      const savedReduced = toggle.reducedMotionSetting;
      const savedDisabled = toggle.disabled;

      const check = (name, pass, detail) => results.push({ name, pass: Boolean(pass), detail });

      try {
        const midSunset = toggle.lighting.evaluateDayToNight(0.45);
        const midSunrise = toggle.lighting.evaluateNightToNextDay(0.45);
        check(
          'Distinct Sunset vs Sunrise Timelines',
          midSunset.sunsetWarmth > 0.6 && midSunset.sunriseWarmth === 0 &&
          midSunrise.sunriseWarmth > 0.6 && midSunrise.sunsetWarmth === 0,
          `sunset=${midSunset.sunsetWarmth.toFixed(2)}, sunrise=${midSunrise.sunriseWarmth.toFixed(2)}`
        );

        const nightCh = toggle.lighting.getRestingChannels('dark');
        check(
          'Night Lighting Channel Contrast',
          nightCh.ambientDaylight < 0.15 && nightCh.deskLampEmission === 1.0 && nightCh.cityWindowEmission >= 0.8,
          `day=${nightCh.ambientDaylight}, lamp=${nightCh.deskLampEmission}, city=${nightCh.cityWindowEmission}`
        );

        toggle.reducedMotionSetting = true;
        toggle.transitionTo('dark', true);
        const darkDomOk = document.documentElement.getAttribute('data-theme') === 'dark'
          && toggle.buttonEl.getAttribute('aria-checked') === 'true'
          && toggle.lensProgress === 1.0;
        check('Light -> Dark + DOM/ARIA Sync', darkDomOk, `theme=${themeCtrl.theme}, lens=${toggle.lensProgress}`);

        toggle.transitionTo('light', true);
        const lightDomOk = document.documentElement.getAttribute('data-theme') === 'light'
          && toggle.buttonEl.getAttribute('aria-checked') === 'false'
          && toggle.lensProgress === 0.0;
        check('Dark -> Light + DOM/ARIA Sync', lightDomOk, `theme=${themeCtrl.theme}, lens=${toggle.lensProgress}`);

        toggle.reducedMotionSetting = false;
        toggle.transitionTo('dark', true);
        toggle.transitionTo('light', true);
        toggle.transitionTo('dark', true);
        check(
          'Rapid Toggle Authoritative State',
          toggle.theme === 'dark' && toggle.transition && toggle.transition.targetTheme === 'dark',
          `finalTarget=${toggle.theme}, activeTimelines=1`
        );

        toggle.scrubLens(1.4, 'day_to_night');
        const hiOk = toggle.lensProgress === 1.0;
        toggle.scrubLens(-0.5, 'night_to_next_day');
        const loOk = toggle.lensProgress === 0.0;
        check('Lens Boundary Clamping [0..1]', hiOk && loOk, `clamped=${hiOk && loOk}`);

        toggle.setDisabled(true);
        const before = toggle.theme;
        toggle.toggle();
        check('Disabled State Guard', toggle.theme === before, `unchanged=${toggle.theme === before}`);
      } finally {
        toggle.setDisabled(savedDisabled);
        toggle.reducedMotionSetting = true;
        toggle.transitionTo(savedTheme, true);
        toggle.reducedMotionSetting = savedReduced;
      }

      return results;
    }

    /* =========================================================================
       9. 9:16 VERTICAL VIDEO STUDIO & CHOREOGRAPHY RECORDER (720x1280 @ 60fps)
       ========================================================================= */
    class VideoStudio9x16 {
      constructor(toggleInstance, audioEngine) {
        this.toggle = toggleInstance;
        this.audio = audioEngine;
        this.modal = document.getElementById('videoStudioModal');
        this.exportCanvas = document.getElementById('videoExportCanvas');
        this.ctx = this.exportCanvas.getContext('2d');
        this.videoEl = document.getElementById('recordedVideoPreview');
        this.recBadge = document.getElementById('recBadge');
        this.recTimerText = document.getElementById('recTimerText');
        this.progressBar = document.getElementById('videoProgressBar');
        this.statusMsg = document.getElementById('videoStatusMsg');
        this.downloadRow = document.getElementById('downloadRow');
        this.downloadLink = document.getElementById('downloadVideoLink');
        this.autoBtn = document.getElementById('startAutoVideoBtn');
        this.manualBtn = document.getElementById('manualRecBtn');

        this.isOpen = false;
        this.isRecording = false;
        this.isAutoPlaying = false;
        this.mediaRecorder = null;
        this.chunks = [];
        this.recordedUrl = null;
        this.recStartTime = 0;
        this.autoDuration = 10000;
        this.autoStepFlags = {};

        this.cursor = { visible: false, x: 360, y: 780, pressed: false, ripple: 0 };

        this._bindUI();
      }

      _bindUI() {
        document.getElementById('videoStudioBtn').addEventListener('click', () => this.open());
        document.getElementById('closeVideoModalBtn').addEventListener('click', () => this.close());
        this.autoBtn.addEventListener('click', () => this.startAutoChoreography());
        this.manualBtn.addEventListener('click', () => this.toggleManualRecording());
        document.getElementById('resetVideoPreviewBtn').addEventListener('click', () => this._showLivePreview());

        let draggingPreview = false;
        this.exportCanvas.addEventListener('pointerdown', (e) => {
          if (this.isAutoPlaying) return;
          if (this.audio) this.audio.playClick(true);
          draggingPreview = true;
          this.exportCanvas.setPointerCapture(e.pointerId);
          this._handlePreviewPointer(e, true);
        });
        this.exportCanvas.addEventListener('pointermove', (e) => {
          if (!draggingPreview || this.isAutoPlaying) return;
          this._handlePreviewPointer(e, false);
        });
        const endPreviewDrag = () => {
          if (!draggingPreview) return;
          draggingPreview = false;
          this.cursor.pressed = false;
          if (this.audio) this.audio.playClick(false);
          const target = this.toggle.lensProgress >= 0.5 ? 'dark' : 'light';
          this.toggle.transitionTo(target, true);
        };
        this.exportCanvas.addEventListener('pointerup', endPreviewDrag);
        this.exportCanvas.addEventListener('pointercancel', endPreviewDrag);
      }

      _handlePreviewPointer(e, isDown) {
        const rect = this.exportCanvas.getBoundingClientRect();
        const nx = (e.clientX - rect.left) / rect.width;
        const ny = (e.clientY - rect.top) / rect.height;
        this.cursor.visible = true;
        this.cursor.x = nx * 720;
        this.cursor.y = ny * 1280;
        this.cursor.pressed = true;
        if (isDown) this.cursor.ripple = 1;

        const progress = MathUtils.clamp((this.cursor.x - 160) / 400, 0, 1);
        const dir = this.toggle.theme === 'light' ? 'day_to_night' : 'night_to_next_day';
        this.toggle.scrubLens(progress, dir);
      }

      open() {
        this.isOpen = true;
        this.modal.classList.remove('hidden');
        this._showLivePreview();
      }

      close() {
        if (this.isRecording) this.stopRecording();
        this.isAutoPlaying = false;
        this.isOpen = false;
        this.cursor.visible = false;
        this.modal.classList.add('hidden');
      }

      _showLivePreview() {
        this.videoEl.pause();
        this.videoEl.classList.add('hidden');
        this.downloadRow.classList.add('hidden');
        this.progressBar.style.width = '0%';
        this.statusMsg.textContent = 'Nhấn "Quay tự động (10s)" để tạo video dọc nghịch nút hoàn chỉnh.';
      }

      _pickMimeType() {
        const candidates = [
          { mime: 'video/mp4;codecs=avc1.42E01E,mp4a.40.2', ext: 'mp4' },
          { mime: 'video/mp4', ext: 'mp4' },
          { mime: 'video/webm;codecs=vp9,opus', ext: 'webm' },
          { mime: 'video/webm;codecs=vp8,opus', ext: 'webm' },
          { mime: 'video/webm', ext: 'webm' }
        ];
        if (typeof MediaRecorder === 'undefined') return null;
        for (const c of candidates) {
          if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c.mime)) {
            return c;
          }
        }
        return { mime: '', ext: 'webm' };
      }

      _startMediaRecorder() {
        const picked = this._pickMimeType();
        if (!picked || !this.exportCanvas.captureStream) {
          this.statusMsg.textContent = 'Trình duyệt hiện tại không hỗ trợ MediaRecorder API.';
          return false;
        }

        try {
          const videoStream = this.exportCanvas.captureStream(60);
          const tracks = [...videoStream.getVideoTracks()];

          // Mux real-time synthesized Web Audio stream directly into the exported video
          if (this.audio && this.audio.enabled) {
            const audioStream = this.audio.getMediaStream();
            if (audioStream) {
              tracks.push(...audioStream.getAudioTracks());
            }
          }

          const combinedStream = new MediaStream(tracks);
          const opts = picked.mime ? { mimeType: picked.mime, videoBitsPerSecond: 6500000 } : { videoBitsPerSecond: 6500000 };
          this.mediaRecorder = new MediaRecorder(combinedStream, opts);
          this.chunks = [];
          this.fileExt = picked.ext;

          this.mediaRecorder.ondataavailable = (ev) => {
            if (ev.data && ev.data.size > 0) this.chunks.push(ev.data);
          };

          this.mediaRecorder.onstop = () => {
            const blob = new Blob(this.chunks, { type: picked.mime || 'video/webm' });
            if (this.recordedUrl) URL.revokeObjectURL(this.recordedUrl);
            this.recordedUrl = URL.createObjectURL(blob);

            this.videoEl.src = this.recordedUrl;
            this.videoEl.classList.remove('hidden');
            this.videoEl.play().catch(() => {});

            this.downloadLink.href = this.recordedUrl;
            this.downloadLink.download = `pixel-liquid-glass-9x16.${this.fileExt}`;
            this.downloadRow.classList.remove('hidden');
            this.statusMsg.textContent = `Đã xuất video 9:16 (.${this.fileExt}) có âm thanh! Xem trước hoặc tải về.`;
          };

          this.mediaRecorder.start(100);
          this.isRecording = true;
          this.recStartTime = performance.now();
          this.recBadge.classList.remove('hidden');
          return true;
        } catch (err) {
          this.statusMsg.textContent = 'Không thể khởi động trình ghi hình: ' + err.message;
          return false;
        }
      }

      stopRecording() {
        if (!this.isRecording) return;
        this.isRecording = false;
        this.isAutoPlaying = false;
        this.cursor.visible = false;
        this.recBadge.classList.add('hidden');
        this.autoBtn.disabled = false;
        this.manualBtn.textContent = '● Tự nghịch & Quay';
        if (this.mediaRecorder && this.mediaRecorder.state !== 'inactive') {
          this.mediaRecorder.stop();
        }
      }

      startAutoChoreography() {
        if (this.isRecording) return;
        if (this.audio) this.audio.unlock();
        this._showLivePreview();

        const prevReduced = this.toggle.reducedMotionSetting;
        this.toggle.reducedMotionSetting = true;
        this.toggle.transitionTo('light', true);
        this.toggle.reducedMotionSetting = prevReduced;

        this.autoStepFlags = {};
        if (!this._startMediaRecorder()) return;

        this.isAutoPlaying = true;
        this.autoBtn.disabled = true;
        this.statusMsg.textContent = 'Đang quay tự động cảnh nghịch nút 9:16 (10 giây)...';
      }

      toggleManualRecording() {
        if (this.isAutoPlaying) return;
        if (this.isRecording) {
          this.stopRecording();
          return;
        }
        if (this.audio) this.audio.unlock();
        this._showLivePreview();
        if (!this._startMediaRecorder()) return;
        this.manualBtn.textContent = '■ Dừng & Xuất video';
        this.statusMsg.textContent = 'Hãy kéo hoặc chạm trực tiếp vào khung 9:16 phía trên để nghịch nút!';
      }

      _updateChoreography(elapsedMs) {
        const t = elapsedMs / 1000;
        const lensMinX = 215;
        const lensMaxX = 505;
        const lensY = 640;
        const curLensX = MathUtils.lerp(lensMinX, lensMaxX, this.toggle.lensProgress);

        if (t < 0.9) {
          const p = MathUtils.smoothstep(0.2, 0.9, t);
          this.cursor.visible = t > 0.15;
          this.cursor.x = MathUtils.lerp(360, lensMinX + 20, p);
          this.cursor.y = MathUtils.lerp(920, lensY + 12, p);
          this.cursor.pressed = false;
        } else if (t < 2.6) {
          if (!this.autoStepFlags.tapNight) {
            this.autoStepFlags.tapNight = true;
            this.cursor.pressed = true;
            this.cursor.ripple = 1;
            if (this.audio) this.audio.playClick(true);
            this.toggle.transitionTo('dark', true);
          }
          if (t > 1.15) this.cursor.pressed = false;
          const p = MathUtils.smoothstep(1.2, 2.4, t);
          this.cursor.x = MathUtils.lerp(lensMinX + 20, lensMaxX, p);
          this.cursor.y = MathUtils.lerp(lensY + 12, lensY + 8, p);
        } else if (t < 3.6) {
          this.cursor.x = lensMaxX;
          this.cursor.y = lensY + 8;
          this.cursor.pressed = false;
        } else if (t < 6.4) {
          this.cursor.pressed = true;
          if (!this.autoStepFlags.grabRipple) {
            this.autoStepFlags.grabRipple = true;
            this.cursor.ripple = 1;
            if (this.audio) this.audio.playClick(true);
          }
          const dragT = (t - 3.6) / 2.8;
          let prog = 1.0;
          if (dragT < 0.42) {
            prog = MathUtils.lerp(1.0, 0.18, MathUtils.smoothstep(0, 0.42, dragT));
          } else if (dragT < 0.75) {
            prog = MathUtils.lerp(0.18, 0.72, MathUtils.smoothstep(0.42, 0.75, dragT));
          } else {
            prog = MathUtils.lerp(0.72, 0.15, MathUtils.smoothstep(0.75, 1.0, dragT));
          }
          this.toggle.scrubLens(prog, 'night_to_next_day');
          this.cursor.x = MathUtils.lerp(lensMinX, lensMaxX, prog);
          this.cursor.y = lensY;
        } else if (t < 8.1) {
          if (!this.autoStepFlags.releaseMorning) {
            this.autoStepFlags.releaseMorning = true;
            this.cursor.pressed = false;
            if (this.audio) this.audio.playClick(false);
            this.toggle.transitionTo('light', true);
          }
          const p = MathUtils.smoothstep(6.5, 7.8, t);
          this.cursor.x = MathUtils.lerp(curLensX, lensMinX + 40, p);
          this.cursor.y = MathUtils.lerp(lensY, lensY + 18, p);
        } else if (t < 10.0) {
          if (!this.autoStepFlags.finalTap) {
            this.autoStepFlags.finalTap = true;
            this.cursor.pressed = true;
            this.cursor.ripple = 1;
            if (this.audio) this.audio.playClick(true);
            this.toggle.transitionTo('dark', true);
          }
          if (t > 8.35) this.cursor.pressed = false;
          const p = MathUtils.smoothstep(8.4, 9.5, t);
          this.cursor.y = MathUtils.lerp(lensY + 18, 960, p);
          if (t > 9.5) this.cursor.visible = false;
        } else {
          this.stopRecording();
        }
      }

      compositeFrame() {
        if (!this.isOpen) return;

        const now = performance.now();
        if (this.isRecording) {
          const elapsed = now - this.recStartTime;
          this.recTimerText.textContent = `REC ${(elapsed / 1000).toFixed(1)}s`;
          if (this.isAutoPlaying) {
            this.progressBar.style.width = `${Math.min(100, (elapsed / this.autoDuration) * 100).toFixed(1)}%`;
            this._updateChoreography(elapsed);
          }
        }

        const ctx = this.ctx;
        const W = 720, H = 1280;
        const ch = this.toggle.channels;
        const night = ch.darkness;

        const bgRGB = MathUtils.lerpRGB([239, 240, 245], [12, 16, 41], night);
        ctx.fillStyle = MathUtils.rgbStr(bgRGB);
        ctx.fillRect(0, 0, W, H);

        const ambGrad = ctx.createRadialGradient(W * 0.5, H * 0.49, 40, W * 0.5, H * 0.49, 440);
        if (night < 0.5) {
          ambGrad.addColorStop(0, `rgba(255,255,255,${(0.7 * (1 - night)).toFixed(3)})`);
          ambGrad.addColorStop(1, 'rgba(255,255,255,0)');
        } else {
          ambGrad.addColorStop(0, `rgba(58,92,196,${(0.26 * night).toFixed(3)})`);
          ambGrad.addColorStop(1, 'rgba(12,16,41,0)');
        }
        ctx.fillStyle = ambGrad;
        ctx.fillRect(0, 0, W, H);

        const capW = 636;
        const capH = 344;
        const capX = (W - capW) / 2;
        const capY = (H - capH) / 2;
        const capR = capH / 2;

        ctx.save();
        ctx.shadowColor = night > 0.5 ? 'rgba(2, 6, 22, 0.82)' : 'rgba(24, 34, 58, 0.24)';
        ctx.shadowBlur = night > 0.5 ? 54 : 42;
        ctx.shadowOffsetY = 26;
        this._roundPillPath(ctx, capX, capY, capW, capH, capR);
        ctx.fillStyle = night > 0.5 ? '#1B243D' : '#D5DCE8';
        ctx.fill();
        ctx.restore();

        const metalGrad = ctx.createLinearGradient(0, capY, 0, capY + capH);
        metalGrad.addColorStop(0.00, MathUtils.rgbStr(MathUtils.lerpRGB([255, 255, 255], [72, 86, 122], night)));
        metalGrad.addColorStop(0.20, MathUtils.rgbStr(MathUtils.lerpRGB([232, 236, 244], [42, 54, 84], night)));
        metalGrad.addColorStop(0.55, MathUtils.rgbStr(MathUtils.lerpRGB([194, 202, 218], [26, 36, 61], night)));
        metalGrad.addColorStop(0.85, MathUtils.rgbStr(MathUtils.lerpRGB([182, 192, 208], [18, 25, 45], night)));
        metalGrad.addColorStop(1.00, MathUtils.rgbStr(MathUtils.lerpRGB([244, 247, 252], [58, 73, 109], night)));

        this._roundPillPath(ctx, capX, capY, capW, capH, capR);
        ctx.fillStyle = metalGrad;
        ctx.fill();

        const pad1 = 12;
        const bevX = capX + pad1, bevY = capY + pad1, bevW = capW - pad1 * 2, bevH = capH - pad1 * 2;
        const bevGrad = ctx.createLinearGradient(0, bevY, 0, bevY + bevH);
        bevGrad.addColorStop(0, MathUtils.rgbStr(MathUtils.lerpRGB([152, 164, 184], [12, 18, 36], night)));
        bevGrad.addColorStop(1, MathUtils.rgbStr(MathUtils.lerpRGB([238, 242, 248], [45, 60, 97], night)));
        this._roundPillPath(ctx, bevX, bevY, bevW, bevH, bevH / 2);
        ctx.fillStyle = bevGrad;
        ctx.fill();

        const pad2 = 16;
        const cavX = capX + pad2, cavY = capY + pad2, cavW = capW - pad2 * 2, cavH = capH - pad2 * 2;
        ctx.save();
        this._roundPillPath(ctx, cavX, cavY, cavW, cavH, cavH / 2);
        ctx.clip();
        ctx.drawImage(this.toggle.canvasEl, cavX, cavY, cavW, cavH);

        const innerShd = ctx.createLinearGradient(0, cavY, 0, cavY + 24);
        innerShd.addColorStop(0, `rgba(10, 16, 36, ${(0.38 + night * 0.30).toFixed(3)})`);
        innerShd.addColorStop(1, 'rgba(10, 16, 36, 0)');
        ctx.fillStyle = innerShd;
        ctx.fillRect(cavX, cavY, cavW, 24);
        ctx.restore();

        ctx.save();
        this._roundPillPath(ctx, capX + 1, capY + 1, capW - 2, capH - 2, capR - 1);
        ctx.strokeStyle = `rgba(255,255,255,${(0.75 - night * 0.48).toFixed(3)})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();

        const textRGB = MathUtils.lerpRGB([27, 36, 54], [233, 238, 249], night);
        ctx.textAlign = 'center';
        ctx.fillStyle = MathUtils.rgbStr(textRGB, 0.42);
        ctx.font = '600 17px Inter, sans-serif';
        ctx.fillText('PIXEL OFFICE  ·  LIQUID GLASS', W / 2, capY - 62);

        const clockStr = this.toggle.lighting.formatLogicalClock(
          this.toggle.phase,
          this.toggle.transition
            ? MathUtils.clamp((now - this.toggle.transition.startTime) / this.toggle.transition.duration, 0, 1)
            : (this.toggle.theme === 'dark' ? 1 : 0)
        );
        const modeLabel = night > 0.5 ? 'DARK MODE' : 'LIGHT MODE';
        ctx.fillStyle = MathUtils.rgbStr(textRGB, 0.50);
        ctx.font = '500 18px "JetBrains Mono", monospace';
        ctx.fillText(`${modeLabel}   ·   ${clockStr}`, W / 2, capY + capH + 74);

        if (this.cursor.visible) {
          if (this.cursor.ripple > 0.01) {
            this.cursor.ripple *= 0.90;
            const ripR = 26 + (1 - this.cursor.ripple) * 44;
            ctx.beginPath();
            ctx.arc(this.cursor.x, this.cursor.y, ripR, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255,255,255,${(this.cursor.ripple * 0.65).toFixed(3)})`;
            ctx.lineWidth = 3;
            ctx.stroke();
          }

          const r = this.cursor.pressed ? 24 : 28;
          ctx.beginPath();
          ctx.arc(this.cursor.x, this.cursor.y, r, 0, Math.PI * 2);
          ctx.fillStyle = this.cursor.pressed ? 'rgba(255,255,255,0.42)' : 'rgba(255,255,255,0.22)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.85)';
          ctx.lineWidth = 2.5;
          ctx.stroke();
        }
      }

      _roundPillPath(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.arcTo(x + w, y, x + w, y + r, r);
        ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
        ctx.lineTo(x + r, y + h);
        ctx.arcTo(x, y + h, x, y + h - r, r);
        ctx.arcTo(x, y, x + r, y, r);
        ctx.closePath();
      }
    }

    /* =========================================================================
       BOOTSTRAP APPLICATION & WIRE OPTIONAL INSPECTOR UI
       ========================================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      const buttonEl = document.getElementById('cinematicToggle');
      const canvasEl = document.getElementById('sceneCanvas');
      const srStatusEl = document.getElementById('srStatus');

      let toggleInstance = null;
      const audioEngine = new RealisticAudioEngine();

      const themeCtrl = new ThemeController((externalTheme) => {
        if (toggleInstance && toggleInstance.theme !== externalTheme) {
          toggleInstance.transitionTo(externalTheme, false);
        }
      });

      const inspectorPanel = document.getElementById('inspectorPanel');
      const renderModeBadge = document.getElementById('renderModeBadge');
      const statTheme = document.getElementById('statTheme');
      const statPhase = document.getElementById('statPhase');
      const statLens = document.getElementById('statLens');
      const statTime = document.getElementById('statTime');
      const statFps = document.getElementById('statFps');
      const channelsGrid = document.getElementById('lightingChannelsGrid');

      const channelDefs = [
        ['ambientDaylight', 'Ambient Day'],
        ['sunsetWarmth', 'Sunset Warmth'],
        ['sunriseWarmth', 'Sunrise Warmth'],
        ['nightAmbient', 'Night Ambient'],
        ['cityWindowEmission', 'City Lights'],
        ['monitorEmission', 'Monitor Glow'],
        ['deskLampEmission', 'Desk Lamp'],
        ['glassReflectionIntensity', 'Glass Reflect']
      ];
      const channelBars = {};
      for (const [key, label] of channelDefs) {
        const wrap = document.createElement('div');
        wrap.innerHTML = `
          <div class="flex justify-between text-[10px] mb-1">
            <span class="opacity-70">${label}</span>
            <span class="mono opacity-90" data-val>0.00</span>
          </div>
          <div class="channel-bar-track"><div class="channel-bar-fill" data-bar style="width:0%"></div></div>
        `;
        channelsGrid.appendChild(wrap);
        channelBars[key] = {
          val: wrap.querySelector('[data-val]'),
          bar: wrap.querySelector('[data-bar]')
        };
      }

      let lastTelemetryPaint = 0;

      toggleInstance = new CinematicThemeToggle({
        buttonEl,
        canvasEl,
        srStatusEl,
        audio: audioEngine,
        initialTheme: themeCtrl.theme,
        animationDuration: 1400,
        enableDrag: true,
        reducedMotion: 'system',
        onThemeChange: (nextTheme) => {
          themeCtrl.setTheme(nextTheme, true);
        },
        onTelemetry: (data) => {
          if (inspectorPanel.classList.contains('hidden')) return;
          const now = performance.now();
          if (now - lastTelemetryPaint < 50) return;
          lastTelemetryPaint = now;

          statTheme.textContent = data.theme;
          statPhase.textContent = data.phase;
          statLens.textContent = data.lensProgress.toFixed(3);
          statTime.textContent = data.logicalClock;
          statFps.textContent = `${data.frameTimeMs.toFixed(1)}ms`;
          renderModeBadge.textContent = data.renderMode === 'webgl' ? 'WebGL Refraction' : 'Canvas2D Fallback';

          for (const [key] of channelDefs) {
            const v = MathUtils.clamp(data.channels[key] || 0, 0, 1);
            channelBars[key].val.textContent = v.toFixed(2);
            channelBars[key].bar.style.width = `${(v * 100).toFixed(1)}%`;
          }
        }
      });

      const videoStudio = new VideoStudio9x16(toggleInstance, audioEngine);
      toggleInstance.onAfterRender = () => videoStudio.compositeFrame();

      const sizeButtons = document.querySelectorAll('[data-size]');
      sizeButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          sizeButtons.forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          toggleInstance.setSize(btn.getAttribute('data-size'));
        });
      });

      const soundBtn = document.getElementById('soundToggleBtn');
      const soundLabel = document.getElementById('soundLabel');
      soundBtn.addEventListener('click', () => {
        const next = !audioEngine.enabled;
        audioEngine.setEnabled(next);
        if (next) audioEngine.playClick(true);
        soundLabel.textContent = next ? 'On' : 'Off';
        soundBtn.classList.toggle('active', next);
      });

      const rmBtn = document.getElementById('reducedMotionBtn');
      const rmLabel = document.getElementById('reducedMotionLabel');
      const rmStates = ['system', true, false];
      const rmNames = ['Auto', 'Reduced', 'Full'];
      let rmIdx = 0;
      rmBtn.addEventListener('click', () => {
        rmIdx = (rmIdx + 1) % rmStates.length;
        toggleInstance.reducedMotionSetting = rmStates[rmIdx];
        rmLabel.textContent = rmNames[rmIdx];
      });

      const inspectorBtn = document.getElementById('inspectorToggleBtn');
      inspectorBtn.addEventListener('click', () => {
        const hidden = inspectorPanel.classList.toggle('hidden');
        inspectorBtn.classList.toggle('active', !hidden);
      });

      const disableBtn = document.getElementById('disableToggleBtn');
      disableBtn.addEventListener('click', () => {
        const next = !toggleInstance.disabled;
        toggleInstance.setDisabled(next);
        disableBtn.textContent = `Disabled: ${next ? 'On' : 'Off'}`;
        disableBtn.classList.toggle('active', next);
      });

      const runTestsBtn = document.getElementById('runTestsBtn');
      const qaResultsBox = document.getElementById('qaResultsBox');
      runTestsBtn.addEventListener('click', () => {
        const results = runQATests(toggleInstance, themeCtrl);
        qaResultsBox.classList.remove('hidden');
        qaResultsBox.innerHTML = results.map((r) => `
          <div class="flex items-center justify-between gap-2 py-0.5">
            <span>${r.pass ? '✅' : '❌'} ${r.name}</span>
            <span class="opacity-65">${r.detail}</span>
          </div>
        `).join('');
      });

      window.addEventListener('beforeunload', () => {
        toggleInstance.destroy();
        themeCtrl.destroy();
        audioEngine.destroy();
      });
    });
  </script>
</body>
